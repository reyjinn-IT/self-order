version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: tableorder-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tableorder_db
      MYSQL_USER: tableorder_user
      MYSQL_PASSWORD: changeme
    ports:
      - "3306:3306"
    volumes:
      - tableorder_mysql_data:/var/lib/mysql

volumes:
  tableorder_mysql_data:
